name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/check_catalogue.py
      - name: Quick-run every result
        run: |
          for d in results/*/; do
            (cd "$d" && python check.py --quick)
          done
